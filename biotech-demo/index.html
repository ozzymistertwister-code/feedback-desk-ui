<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biotech Strategy Graph — Demo</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1424;color:#e9f2ff;font:15px system-ui}header{padding:18px 22px;border-bottom:1px solid #30435e}small{color:#a9bfd8}main{display:grid;grid-template-columns:1fr 310px;min-height:85vh}svg{width:100%;height:80vh;touch-action:none}aside{padding:25px;background:#14233a;border-left:1px solid #30435e}h1{font-size:20px;margin:0 0 5px}h2{font-size:22px}p{line-height:1.6;color:#bdd0e5}.node{cursor:pointer}.node circle{stroke:#d1e7ff;stroke-width:2}.node text{fill:#fff;font-size:12px;pointer-events:none}.edge{stroke:#607d9e;stroke-width:2}button{padding:9px 13px;background:#284c79;border:1px solid #5477a0;color:white;border-radius:8px;margin:3px;cursor:pointer}@media(max-width:720px){main{display:block}svg{height:56vh}aside{min-height:30vh;border:0;border-top:1px solid #30435e}}</style></head><body><header><h1>Biotech Strategy Graph</h1><small>Интерактивная демонстрация · публичная версия без внутренних данных</small></header><main><div><svg id="graph" viewBox="0 0 850 680"></svg><div style="padding:0 15px"><button onclick="zoom(1.2)">+</button><button onclick="zoom(0.8)">−</button><button onclick="reset()">Сброс</button></div></div><aside><small>КАРТОЧКА УЗЛА</small><h2 id="name">Биотехнологический кампус</h2><p id="desc">Нажмите на направление графа, чтобы открыть карточку. Это демонстрационная версия без корпоративных данных.</p><small id="status">Стратегический центр</small></aside></main><script>const nodes=[["БТК","Центральный стратегический узел",0],["Геномика","Геномные исследования и биоинформатика",1],["Нейротехнологии","Исследование мозга и нейроинтерфейсы",1],["Долголетие","Биология старения и здоровое долголетие",1],["Персональная медицина","Персонализированные подходы к здоровью",1],["Научный ИИ","Аналитика научных знаний и исследования",1],["Цифровые платформы","Данные, приложения и цифровые инструменты",1],["Биомедицинские исследования","Междисциплинарные исследования",1]];const svg=document.getElementById("graph");let scale=1;function el(t,a,parent){let x=document.createElementNS("http://www.w3.org/2000/svg",t);Object.entries(a).forEach(([k,v])=>x.setAttribute(k,v));parent.appendChild(x);return x}let g=el("g",{id:"stage"},svg),positions=[[425,340],...Array.from({length:7},(_,i)=>{let a=-Math.PI/2+i*Math.PI*2/7;return[425+255*Math.cos(a),340+245*Math.sin(a)]})];positions.slice(1).forEach(p=>el("line",{x1:425,y1:340,x2:p[0],y2:p[1],class:"edge"},g));nodes.forEach((n,i)=>{let [x,y]=positions[i],group=el("g",{class:"node",transform:"translate("+x+","+y+")"},g);el("circle",{r:i?64:75,fill:i?"#24527d":"#286a77"},group);let words=n[0].split(" "),lines=words.length>1?[words.slice(0,Math.ceil(words.length/2)).join(" "),words.slice(Math.ceil(words.length/2)).join(" ")]:words;lines.forEach((line,j)=>{let t=el("text",{"text-anchor":"middle",y:(j-(lines.length-1)/2)*16+4},group);t.textContent=line});group.addEventListener("click",()=>{document.getElementById("name").textContent=n[0];document.getElementById("desc").textContent=n[1]+". Подробные данные, статусы и связи будут добавлены после подтверждения владельцем продукта.";document.getElementById("status").textContent=i?"Направление · демоверсия":"Стратегический центр"})});function apply(){g.setAttribute("transform","translate("+425*(1-scale)+" "+340*(1-scale)+") scale("+scale+")")}function zoom(v){scale=Math.max(.55,Math.min(2.5,scale*v));apply()}function reset(){scale=1;apply()}</script></body></html>
