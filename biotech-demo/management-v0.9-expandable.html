</style></head><body><header><div><h1>Biotech Strategy Graph <span class="tag">v0.7</span></h1><small>Стратегический портфель 2027–2031 · 14 продуктов · источник статусов 09.11.2026</small></div><small>Полная управленческая версия · публичный URL по разрешению владельца</small></header><nav id="nav"></nav><main class="wrap" id="app"></main><script id="dataset" type="application/json">{"version":"v0.8","date":"2026-11-14","products":[{"id":"p1","name":"Предикс.Здоровье","category":"ИТ / Наука","finance":{"number":1,"name":"Предикс.Здоровье","category":"ИТ / Наука","annual":{"2027":167489816,"2028":167489816,"2029":167489816,"2030":167489816,"2031":167489816},"five_year_total":837449080,"creation":167489816,"development":669959264,"notes":"167 489 816 ₽ каждый год; после 2027 развитие и сопровождение."},"purpose":"Мобильный персональный цифровой помощник: профилактика, выявление рисков, управление здоровьем и сопровождение пользователя. Данные образа жизни, устройств, медицины и генетики.","achieved":["Мобильное приложение Android и iOS — действующий продукт","Модуль питания: распознавание еды по описанию и работа с камерой — отмечено как доработанное в статусе 09.11","507 установок; MAU 222; WAU 105 — срез 09.11.2026","Проведена рекламная кампания на 3 500 человек; коммуникации с пользователями","Паспорт здоровья, анкеты, показатели устройств, раздел документов и индексы — описаны в продуктовой спецификации; точный состав релиза требует сверки","Android/iOS и базовый MVP; 20 спринтов (отчёт 21.10.2026).","Четыре модуля рисков: ССЗ, диабет, ХБП, онкология; пять моделей сопутствующих заболеваний (отчёт 24.09.2026).","PhenoAge и биологический возраст Горелкина–Пинхасова внедрены (отчёт 24.09.2026).","QR-интеграция генетического паспорта БТК, интеграции Nera и Кардиокарта (отчёты 06.09 и 21.10.2026).","Версия 1.17.0: подсказки Сон/Пульс/ВСР, привычки, питание 0.5, разбор анализов и генетического паспорта, награды (база знаний 13.08.2026).","По статусу 09.11.2026: 507 установок, 222 MAU, 105 WAU; распознавание еды по описанию и автофокус камеры доработаны."],"modules":[["Android и iOS","Нативные мобильные приложения, опытная эксплуатация; Android через корпоративный портал, iOS через TestFlight. Выполнены базовый MVP, проектно-техническая документация, 20 спринтов; зарегистрирован НМА по сведениям сентября 2026.","реализовано / подтверждено 21.10.2026"],["Главная и виджеты","Главная: риски, индексы, показатели устройств, рекомендации, задания, новости. Карточки сна, пульса, ВСР, питания, привычек. Изменение состава виджетов и прокрутки Android — отдельные задачи.","реализован базовый контур; улучшения в разработке"],["Паспорт здоровья","Единый профиль: пол, возраст, антропометрия, ИМТ, семейный и медицинский анамнез, генетика, анализы, обследования, риски, устройства, самочувствие. Целевая единая временная шкала и происхождение показателей.","базовый функционал реализован; расширение запланировано"],["Анкеты и опросники","Общие, кардиологические, онкологические, диабетические, питание; семейный анамнез, показания к генетическому тестированию. Дополнительные целевые анкеты репродуктивного здоровья — развитие.","базовые анкеты реализованы; расширения запланированы"],["Риски ССЗ","Модуль оценки сердечно-сосудистых рисков, анкеты, генетические факторы, планируемое объединение с лабораторными и приборными данными.","реализован модуль; динамические риски — развитие"],["Риски диабета","Оценка риска диабета и метаболических нарушений, сопутствующие модели; перспективное использование CGM и пилота NeurOx.","реализован модуль; CGM — план"],["Риски онкологии","Модуль оценки онкологических рисков, семейный анамнез, генетическая предрасположенность, профилактическая маршрутизация.","реализован модуль; клиническое развитие — план"],["Риски хронической болезни почек","Отдельный модуль оценки риска ХБП, отмеченный в отчёте сентября 2026.","реализовано по отчёту 24.09.2026"],["Модели сопутствующих заболеваний","Пять моделей сопутствующих заболеваний отмечены в отчёте сентября 2026; названия и валидация требуют подтверждения.","реализованы по отчёту; состав уточняется"],["Биологический возраст — PhenoAge","Расчёт биологического возраста на основании лабораторных показателей; исследовательский индикатор, не клинический диагноз.","реализовано"],["Биологический возраст — Горелкин–Пинхасов","Антропометрическая методика оценки биологического возраста; интерпретация с указанием ограничений.","реализовано"],["Генетический паспорт БТК","Получение генетического портрета из личного кабинета БТК через QR; отображение генетических факторов и их интерпретации. SSI-запросы организаций пока не реализованы.","QR-интеграция реализована; SSI — план"],["Лабораторные исследования","Загрузка и распознавание лабораторных документов; биохимические показатели, единицы, референсы, даты; рекомендации по анализам развиваются.","базовый разбор реализован; рекомендации в разработке"],["Медицинские документы","Сейчас подтверждены лабораторные исследования и генетический паспорт. Приёмы врачей, инструментальные исследования, диспансеризация, запросы и обмен — расширение; не считать готовыми из-за наличия пунктов меню.","частично реализовано / расширение запланировано"],["Носимые устройства и Health Connect","Интеграции с Nera, Кардиокартой, Health Connect и поддерживаемыми источниками; показатели активности, сна, пульса и ВСР. Борьба с дублями и новые источники — развитие.","часть интеграций реализована; перечень требует релизной проверки"],["Samsung / Garmin / Apple Health","Сценарии подключения через системные источники и будущие интеграции. Apple Health, Garmin и Samsung не считать полностью реализованными без проверки конкретной версии.","частично / план, уточнить по релизу"],["ИИ-помощник Сиби","Диалоговый ИИ и пояснения показателей; Сиби обозначает сгенерированные блоки. Повторная генерация, асинхронность «Научного», объяснимость и безопасная медицинская маршрутизация.","базовый чат реализован; улучшения в разработке"],["Персональные рекомендации","Контекстные рекомендации по данным, динамике, рискам, привычкам, лабораторным показателям; цель — следующий понятный шаг и постоянное сопровождение.","базовые рекомендации реализованы; углубление 2027"],["Сон, пульс, ВСР","Интеллектуальные подсказки по сну, пульсу, вариабельности сердечного ритма вошли в 1.17.0; дальнейший анализ личной нормы, восстановления и стресса.","подсказки реализованы в 1.17.0; расширение планируется"],["Стресс и восстановление","Комплексное направление стресс/сон/ресурс организма, WSR от NeurOx, динамика и индивидуальные рекомендации.","расширение 2027; WSR — партнёрский план"],["Питание и вес","Дневник питания, фото-распознавание еды, оценка КБЖУ, текстовое уточнение; распознавание еды по описанию и автофокус отмечены как доработанные 09.11.2026.","базовый модуль реализован; развитие продолжается"],["Питьевой баланс и алкоголь","Учет воды и употребления алкоголя, соответствующие пользовательские сценарии и аналитика.","в работе по статусу 09.11.2026"],["Аллергены в еде","Извлечение аллергенов из описаний/изображений пищи; требует проверки и качества распознавания.","тестирование по статусу 09.11.2026"],["Привычки","«Ваши привычки», календарь, выполнение и удаление привычек; v2 обозначена как план 1.18.0.","базовый модуль реализован; v2 требует проверки релиза"],["Награды и вовлечение","Раздел «Мои награды», мотивация полезных действий, без наказания за болезнь или пропуск.","реализовано в 1.17.0"],["Самочувствие и ручной ввод","Ежедневная самооценка самочувствия, ручной ввод измерений и антропометрии; связь с индексами и рекомендациями.","описано в действующем продуктовом контуре"],["Лекарства и БАДы","Учет препаратов и добавок, регулярности приёма, ограничений и согласованной медицинской логики.","план 2027"],["Психологическая поддержка","Партнёрский модуль с «Ренессанс Страхование» / «Просебя»: опросники, поддержка, возможная маршрутизация к специалисту.","партнёрская разработка / пилот планируется"],["CGM / неинвазивный мо общие Visiology и ETL ЕЦПК\n","questions":"# Открытые вопросы для руководителя\n\n1. УАП 2.0: восемь прототипов каждые два месяца с февраля 2027 математически не укладываются до декабря 2027. Уточнить параллельность или частоту релизов.\n2. УАП 2.0: точные критерии MVP, дата пилота и миграции.\n3. Предикс.Здоровье: статус соглашений с МФТИ/NeurOx и Ренессанс Страхование; критерии валидации датчика глюкозы.\n4. Crawler и ИИ-помощник: что считать «рабочим использованием» летом 2027, кто принимает результат.\n5. Атлас мозга/BCI: какие исследования относятся к каждому направлению и кто партнёр.\n6. Геномика: критерии завершения этапа развёртывания/проработки в 2027.\n7. Бюджеты: приложить исходный Excel для точной загрузки стоимости по продуктам и годам.\n8. Публикация: какие данные можно показывать на открытом syst8m.com/biotech/index.html? Полная версия остаётся приватной.\n","strategy":"# Стратегические ориентиры 2027 — решения владельца портфеля, 14.11.2026\n\n## Общая цель\nПо каждому продукту получить подтверждённый результат: прототип, работающее решение либо завершённый этап исследований. Продукты не ранжированы.\n\n## Предикс.Здоровье\nПродолжать развитие действующего приложения; сценарии для здоровых пользователей, предрисков, рисков и диагностированных заболеваний; лекарства, БАДы, стресс, сон, документы, персональные рекомендации. Партнёры: МФТИ/NeurOx (первоначально 3 устройства; планируемый пилот — 100 здоровых, 100 с преддиабетом, 100 с диабетом; технология неинвазивного измерения требует валидации; показатели WSR); Ренессанс Страхование — психологическая поддержка.\n\n## УАП 2.0\nАнализ УАП 1.0; восемь прототипов по функциям ориентировочно раз в два месяца начиная с февраля 2027; интегрированный MVP к концу года; затем пилот, миграция и развитие не менее года. **Требует календарной сверки:** 8 прототипов с интервалом 2 месяца не помещаются между февралем и декабрем 2027; это открытый вопрос, а не утверждённый график.\n\n## Геномика\nРазвёртывание и исследование платформы в 2027 году, уточнение дальнейших гипотез.\n\n## Crawler и врач-интерпретатор\nЕжемесячные прототипы; целевое рабочее использование летом 2027. Граф знаний — обязательный компонент Crawler.\n\n## Атлас мозга и BCI\nСтратегические партнёрские исследования, включая ДЦП, рассеянный склероз, болезнь Альцгеймера; конкретная привязка исследований к каждому продукту пока не утверждена.\n\n## BI\nЧетыре самостоятельных продукта, общая Visiology и ETL ЕЦПК.\n\n## Финансы\nПользователь ссылается на Excel «Биотехкампус_14_продуктов_2027-2031_без_ошибок.xlsx», созданный ранее. В текущей рабочей среде оригинал не обнаружен; продуктовые суммы намеренно не придуманы.\n","total":7710372885,"annual":{"2027":3098959899,"2028":1513369924,"2029":1366014354,"2030":1366014354,"2031":366014354},"source_note":"Утверждённая презентация 09.11.2026; уточнения 14.11.2026; финансовая модель XLSX. Плановые даты не считаются выполнением."}</script><script>

levels.slice(1).forEach((layer,idx)=>{let radius=idx===0?270:idx===1?590:590+idx*360;let prev=levels[idx];let parentIndex=new Map(prev.map((n,i)=>[n.id,i]));let ordered=[...layer].sort((a,b)=>(parentIndex.get(a.parent)||0)-(parentIndex.get(b.parent)||0));ordered.forEach((n,i)=>{let angle=2*Math.PI*i/ordered.length-Math.PI/2;positions.set(n.id,{x:radius*Math.cos(angle),y:radius*Math.sin(angle)})})});return {visible,positions,map};}
function gLabel(str,max=22){str=String(str);return str.length>max?str.slice(0,max-1)+'…':str}
function graphView(){let all=gData(),layout=gLayout(all),v=layout.visible,pos=layout.positions;let ids=new Set(v.map(n=>n.id));let lines=all.es.filter(([a,b])=>ids.has(a)&&ids.has(b)).map(([a,b])=>{let x=pos.get(a),y=pos.get(b);return '<line class="g-edge" x1="'+x.x+'" y1="'+x.y+'" x2="'+y.x+'" y2="'+y.y+'"/>'}).join('');lines+=all.related.filter(([a,b])=>ids.has(a)&&ids.has(b)).map(([a,b])=>{let x=pos.get(a),y=pos.get(b);return '<line class="g-edge related" x1="'+x.x+'" y1="'+x.y+'" x2="'+y.x+'" y2="'+y.y+'"/>'}).join('');let colors={org:'#347b83',dir:'#315f87',prod:'#2679b2',tech:'#8156a0',group:'#7b6d41',leaf:'#526780',detail:'#54636c'};let circles=v.map(n=>{let q=pos.get(n.id),r=n.kind==='org'?60:n.kind==='dir'?40:n.kind==='prod'?32:n.kind==='group'?27:23;let label=gLabel(n.label,n.kind==='dir'?24:32);return '<g class="g-node '+(graphSelected===n.id?'selected':'')+'" onclick="gSelect(\''+n.id+'\')" ondblclick="gFocus(\''+n.id+'\')" transform="translate('+q.x+' '+q.y+')"><title>'+esc(n.label)+'</title><circle r="'+r+'" fill="'+colors[n.kind]+'"/><text text-anchor="middle" y="'+(r+19)+'">'+esc(label)+'</text></g>'}).join('');let target=all.ns.find(n=>n.id===graphSelected)||all.ns[0];return '<h2>Интерактивная карта стратегии и знаний · ДПР</h2><p class="muted">Одно нажатие — описание. Двойное нажатие — раскрыть узел в центре карты. Все модули, планы, решения, вопросы и бюджеты раскрываются внутри графа. Можно приближать, перемещать и возвращаться вверх.</p><div class="g-toolbar"><button onclick="gReset()">Вся стратегия</button><button onclick="gBack()">↑ Назад</button><button onclick="gDepth(1)">1 уровень</button><button onclick="gDepth(2)">2 уровня</button><button onclick="gDepth(3)">3 уровня</button><button onclick="gDepth(4)">4 уровня</button><button onclick="gZoom(.75)">＋</button><button onclick="gZoom(1.33)">－</button><button onclick="gFit()">Вписать</button><button onclick="gFullscreen()">На весь экран</button></div><div class="g-legend"><span class="l-org">ДПР</span><span class="l-dir">Направления</span><span class="l-prod">Продукты</span><span class="l-tech">Технологии</span><span class="l-detail">Детализация</span></div><div class="graph-layout"><div class="graph-canvas" id="graphcanvas"><svg id="graphsvg" viewBox="'+[graphBox.x,graphBox.y,graphBox.w,graphBox.h].join(' ')+'" onpointerdown="gPointerDown(event)" onpointermove="gPointerMove(event)" onpointerup="gPointerUp(event)" onpointercancel="gPointerUp(event)" onwheel="gWheel(event)"><g>'+lines+circles+'</g></svg></div><div class="g-detail" id="gdetail">'+gDetail(target,all)+'</div></div>'}
function gDetail(n,all){let out='<small>'+({org:'Дирекция',dir:'Стратегическое направление',prod:'Продукт',tech:'Технология',group:'Раздел продукта',leaf:'Элемент',detail:'Подробность'}[n.kind]||'Узел')+'</small><h3>'+esc(n.label)+'</h3>';if(n.desc)out+='<p>'+esc(n.desc)+'</p>';if(n.product){out+='<p>'+esc(n.product.purpose||'')+'</p>';if(n.kind==='prod')out+='<p><b>Бюджет 2027:</b> '+rub(n.product.finance.annual['2027'])+'<br><b>2027–2031:</b> '+rub(n.product.finance.five_year_total)+'</p><button onclick="pick(\''+n.product.id+'\')">Полная карточка продукта</button>';if(n.section)out+='<button onclick="pick(\''+n.product.id+'\',\''+n.section+'\')">Открыть раздел в карточке</button>';}if(n.items)out+='<ul>'+n.items.map(x=>'<li>'+esc(Array.isArray(x)?x.join(' — '):typeof x==='object'?JSON.stringify(x):x)+'</li>').join('')+'</ul>';if(n.item)out+='<p>'+esc(Array.isArray(n.item)?n.item.join(' — '):n.item)+'</p>';let children=gChildren(all,n.id);if(children.length)out+='<p><b>Связанные дочерние узлы:</b> '+children.length+'</p><button onclick="gFocus(\''+n.id+'\')">Развернуть этот узел</button>';return out;}
function gSelect(id){graphSelected=id;let all=gData(),n=all.ns.find(n=>n.id===id);if(n)document.getElementById('gdetail').innerHTML=gDetail(n,all);document.querySelectorAll('.g-node').forEach(x=>x.classList.toggle('selected',x.getAttribute('onclick')==="gSelect('"+id+"')"));if(window.gLast===id&&Date.now()-window.gLastAt<450){gFocus(id)}window.gLast=id;window.gLastAt=Date.now()}
function gFocus(id){graphFocus=id;graphSelected=id;graphDepth=2;render();gFit()}
function gReset(){gFocus('root')}
function gBack(){let n=gData().ns.find(n=>n.id===graphFocus);gFocus(n?.parent||'root')}
function gDepth(n){graphDepth=n;render();gFit()}
function gFit(){let layout=gLayout(gData());let pts=[...layout.positions.values()];let max=Math.max(400,...pts.map(p=>Math.max(Math.abs(p.x),Math.abs(p.y))));graphBox={x:-max-190,y:-max-190,w:2*(max+190),h:2*(max+190)};gUpdateBox()}
function gFullscreen(){let e=document.getElementById('graphcanvas');if(e?.requestFullscreen)e.requestFullscreen()}
function gZoom(f){let b=graphBox,cx=b.x+b.w/2,cy=b.y+b.h/2;b.w*=f;b.h*=f;b.x=cx-b.w/2;b.y=cy-b.h/2;gUpdateBox()}
function gUpdateBox(){let el=document.getElementById('graphsvg');if(el)el.setAttribute('viewBox',[graphBox.x,graphBox.y,graphBox.w,graphBox.h].join(' '))}
function gPointerDown(e){if(e.target.closest('.g-node'))return;let svg=e.currentTarget;svg.setPointerCapture(e.pointerId);graphDrag={x:e.clientX,y:e.clientY,bx:graphBox.x,by:graphBox.y}}
function gPointerMove(e){if(!graphDrag)return;let rect=e.currentTarget.getBoundingClientRect();graphBox.x=graphDrag.bx-(e.clientX-graphDrag.x)*graphBox.w/rect.width;graphBox.y=graphDrag.by-(e.clientY-graphDrag.y)*graphBox.h/rect.height;gUpdateBox()}
function gPointerUp(e){graphDrag=null}
function gWheel(e){e.preventDefault();gZoom(e.deltaY>0?1.1:.9)}

function render(){const nav=[['graph','Граф знаний'],['home','Сводка'],['products','Продукты и модули'],['finance','Финансы'],['questions','Открытые вопросы'],['decisions','Решения'],['strategy','Стратегия 2027']];$('#nav').innerHTML=nav.map(([id,label])=>'<button class="'+(view===id?'active':'')+'" onclick="setView(\''+id+'\')">'+label+'</button>').join('');$('#app').innerHTML=view==='graph'?graphView():view==='home'?home():view==='products'?product():view==='finance'?finance():textDoc(D[view]||'');}render();
</script></body></html>
