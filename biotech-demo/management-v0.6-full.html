та.\n3. УАП 2.0 и Платформа «Геномика» должны размещаться в Kubernetes поверх ЕЦПК и использовать её сервисы. Для ИИ-помощника это не подтверждено.\n4. ЕЦПК — корпоративная платформа на базе Alauda с внутренними доработками, не только ETL.\n5. Предусмотрены PostgreSQL, Kafka, ClickHouse, MLOps и LLMaaS. Статус отдельных компонентов уточняется.\n6. Оперативное хранилище геномных данных — NFS; не смешивать с технологическим стеком ЕЦПК.\n7. Геораспределённая инфраструктура строится отдельно: план 7 серверов с NVIDIA B300; экспертная оценка ~100 млн ₽ за один сервер, ~700 млн ₽ за серверную часть. Конфигурация 8 GPU/сервер предварительная.\n8. Геораспределённое S3-хранилище: предварительная гипотеза ёмкости 256 ПБ, не утверждённая спецификация. Москва: оценка ~40 ПБ, требует подтверждения.\n9. Приоритеты продуктов определяет руководитель, автоматическое ранжирование запрещено.\n10. Презентация от 09.11.2026 утверждена как базовый источник; плановые вехи не считать автоматически выполненными.\n\n\n## Уточнения владельца портфеля от 14.11.2026\n- Приоритеты всех продуктов равны по включению в портфель; Предикс.Здоровье продолжать развивать как готовый продукт\n- УАП 2.0: MVP к концу 2027; пилот и миграция после MVP\n- Платформа Геномика: в 2027 развёртывание и исследование возможностей\n- Crawler и ИИ-помощник врача: завершение к лету 2027, ежемесячные прототипы; граф знаний обязателен для Crawler\n- Атлас мозга и BCI: стратегические партнёрские исследования\n- BI: четыре самостоятельных продукта, общие Visiology и ETL ЕЦПК\n", "questions": "# Открытые вопросы для руководителя\n\n1. УАП 2.0: восемь прототипов каждые два месяца с февраля 2027 математически не укладываются до декабря 2027. Уточнить параллельность или частоту релизов.\n2. УАП 2.0: точные критерии MVP, дата пилота и миграции.\n3. Предикс.Здоровье: статус соглашений с МФТИ/NeurOx и Ренессанс Страхование; критерии валидации датчика глюкозы.\n4. Crawler и ИИ-помощник: что считать «рабочим использованием» летом 2027, кто принимает результат.\n5. Атлас мозга/BCI: какие исследования относятся к каждому направлению и кто партнёр.\n6. Геномика: критерии завершения этапа развёртывания/проработки в 2027.\n7. Бюджеты: приложить исходный Excel для точной загрузки стоимости по продуктам и годам.\n8. Публикация: какие данные можно показывать на открытом syst8m.com/biotech/index.html? Полная версия остаётся приватной.\n", "strategy": "# Стратегические ориентиры 2027 — решения владельца портфеля, 14.11.2026\n\n## Общая цель\nПо каждому продукту получить подтверждённый результат: прототип, работающее решение либо завершённый этап исследований. Продукты не ранжированы.\n\n## Предикс.Здоровье\nПродолжать развитие действующего приложения; сценарии для здоровых пользователей, предрисков, рисков и диагностированных заболеваний; лекарства, БАДы, стресс, сон, документы, персональные рекомендации. Партнёры: МФТИ/NeurOx (первоначально 3 устройства; планируемый пилот — 100 здоровых, 100 с преддиабетом, 100 с диабетом; технология неинвазивного измерения требует валидации; показатели WSR); Ренессанс Страхование — психологическая поддержка.\n\n## УАП 2.0\nАнализ УАП 1.0; восемь прототипов по функциям ориентировочно раз в два месяца начиная с февраля 2027; интегрированный MVP к концу года; затем пилот, миграция и развитие не менее года. **Требует календарной сверки:** 8 прототипов с интервалом 2 месяца не помещаются между февралем и декабрем 2027; это открытый вопрос, а не утверждённый график.\n\n## Геномика\nРазвёртывание и исследование платформы в 2027 году, уточнение дальнейших гипотез.\n\n## Crawler и врач-интерпретатор\nЕжемесячные прототипы; целевое рабочее использование летом 2027. Граф знаний — обязательный компонент Crawler.\n\n## Атлас мозга и BCI\nСтратегические партнёрские исследования, включая ДЦП, рассеянный склероз, болезнь Альцгеймера; конкретная привязка исследований к каждому продукту пока не утверждена.\n\n## BI\nЧетыре самостоятельных продукта, общая Visiology и ETL ЕЦПК.\n\n## Ф
